name: Sync Upstream

# 手动触发：Actions -> Sync Upstream -> Run workflow。
# 合并上游 ArcSurge/Termius-Pro-zh_CN 的 main 分支；是否跟进由维护者决定。
#
# 冲突策略：
#   - README.md 由本 fork 维护（含字体/发布说明），冲突时保留本仓库版本；
#   - .gitignore 冲突时合并双方条目，保留 fork 与上游各自新增的忽略项；
#   - 其它文件出现冲突时直接失败（红色）并中止合并，绝不带着未解决冲突推送。
# 这样既保留上游规则/代码的更新能力，又不会静默覆盖 fork 的落地页。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ArcSurge/Termius-Pro-zh_CN.git 2>/dev/null \
            || git remote set-url upstream https://github.com/ArcSurge/Termius-Pro-zh_CN.git
          git fetch upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config rerere.enabled false

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "✓ Already up to date with upstream/main"
            exit 0
          fi

          echo "⇣ New upstream commits found, merging..."
          if git merge upstream/main --no-edit; then
            echo "✓ Merged cleanly"
          else
            conflicts=$(git diff --name-only --diff-filter=U || true)
            unexpected=""
            readme_resolved=false
            gitignore_resolved=false

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                README.md)
                  echo "::warning::README.md conflicts with upstream; keeping the fork version."
                  git checkout --ours -- README.md
                  git add README.md
                  readme_resolved=true
                  ;;
                .gitignore)
                  echo "::warning::.gitignore conflicts with upstream; merging both sides."
                  {
                    git show :2:.gitignore
                    git show :3:.gitignore
                  } | awk '!seen[$0]++' > .gitignore
                  git add .gitignore
                  gitignore_resolved=true
                  ;;
                *)
                  unexpected="${unexpected} ${file}"
                  ;;
              esac
            done <<< "$conflicts"

            if [ -n "$unexpected" ]; then
              echo "::error::Unexpected merge conflicts (only README.md and .gitignore may be auto-resolved):${unexpected}"
              git merge --abort || true
              exit 1
            fi

            git commit --no-edit
            {
              echo "### Upstream sync"
              if [ "$readme_resolved" = true ]; then
                echo "- README.md: kept fork version"
              fi
              if [ "$gitignore_resolved" = true ]; then
                echo "- .gitignore: merged fork and upstream entries"
              fi
              echo "- merge commit: $(git rev-parse --short HEAD)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "Validating merged rules before push..."
          python tools/lint_rules.py rules \
            || { echo "::error::Merged rules failed lint; not pushing"; exit 1; }
          python -m pytest -q \
            || { echo "::error::Merged rules failed tests; not pushing"; exit 1; }

          git push origin main
          echo "✓ Pushed merge commit to origin/main"
