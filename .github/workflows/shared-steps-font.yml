name: Shared Workflow Steps for Font Release

on:
  workflow_call:
    inputs:
      run_on:
        description: "The running platform (ubuntu, macos, windows)"
        required: true
        type: string
      platform:
        description: "The target platform (linux, macos, windows)"
        required: true
        type: string
      version_command:
        description: "The command to extract the version from the downloaded package"
        required: true
        type: string
      install_command:
        description: "The command to install the Termius package"
        required: true
        type: string
      source_path:
        description: "The source path of the app.asar file"
        required: true
        type: string
      force_release:
        description: "Force release even if version not newer"
        required: false
        type: boolean
        default: false
      publish:
        description: "Publish the release immediately instead of saving a draft"
        required: false
        type: boolean
        default: false

# 发布 Release 需要 GITHUB_TOKEN 具备写权限（新仓库默认只读，必须显式声明）
permissions:
  contents: write

jobs:
  template:
    runs-on: ${{ inputs.run_on }}
    timeout-minutes: 15
    steps:
      - name: Checkout source code from repository
        uses: actions/checkout@v5
      - name: Extract Termius package version
        id: extract_version
        run: |
          ${{ inputs.version_command }}
          echo "✓ Extracted version: $termius_version"
      - name: Validate extracted version
        id: validate_version
        shell: bash
        run: |
          set -e
          echo "Validating version: $TERMIUS_VERSION"
          if [ -z "$TERMIUS_VERSION" ]; then
            echo "::error::Version validation failed - no version extracted"
            exit 1
          fi
          echo "✓ Version validation passed: $TERMIUS_VERSION"
      - name: Fetch latest published release version
        if: ${{ !inputs.force_release }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          release_url="https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          response=$(curl -s -f -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$release_url")
          echo "::debug::GitHub API response: $(jq -c . <<< "$response")"
          # releases/latest 会忽略草稿；这里显式取“已发布且非预发布”的最高版本，
          # 否则仓库里全是草稿时会一直回退到 0.0.0，每次定时任务都重复构建。
          github_version=$(echo "$response" \
            | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            | sed 's/^v//' \
            | grep -E '^[0-9]' \
            | sort -V \
            | tail -n1)
          github_version=${github_version:-0.0.0}
          echo "✓ Latest published release: v$github_version"
          echo "GITHUB_VERSION=$github_version" >> $GITHUB_ENV
      - name: Compare version metadata
        id: compare_versions
        shell: bash
        run: |
          set -e
          if [ "${{ inputs.force_release }}" = "true" ]; then
            echo "::notice::Force release enabled. Skipping version check."
            echo "should_continue=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Comparing versions: Termius=$TERMIUS_VERSION vs GitHub=$GITHUB_VERSION"
          if [ "$(printf '%s\n' "$TERMIUS_VERSION" "$GITHUB_VERSION" | sort -V | tail -n1)" == "$TERMIUS_VERSION" ] && [ "$TERMIUS_VERSION" != "$GITHUB_VERSION" ]; then
            echo "::notice::✓ Version check passed: Termius ($TERMIUS_VERSION) > GitHub ($GITHUB_VERSION)"
            echo "should_continue=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::✗ Version check failed: Termius ($TERMIUS_VERSION) <= GitHub ($GITHUB_VERSION)"
            echo "should_continue=false" >> $GITHUB_OUTPUT
          fi
      - name: Configure Python runtime environment
        if: steps.compare_versions.outputs.should_continue == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        if: steps.compare_versions.outputs.should_continue == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Termius application package
        if: steps.compare_versions.outputs.should_continue == 'true'
        run: |
          echo "Installing Termius v$TERMIUS_VERSION..."
          ${{ inputs.install_command }}
      - name: Install asar packaging tool
        if: steps.compare_versions.outputs.should_continue == 'true'
        shell: bash
        run: |
          set -e
          npm install -g @electron/asar || { echo "::error::Failed to install asar"; exit 1; }
      - name: Lint rules
        if: steps.compare_versions.outputs.should_continue == 'true'
        shell: bash
        run: python tools/lint_rules.py rules
      - name: Run tests
        if: steps.compare_versions.outputs.should_continue == 'true'
        shell: bash
        run: python -m pytest -q
      - name: Generate localization + font assets
        if: steps.compare_versions.outputs.should_continue == 'true'
        shell: bash
        run: |
          set -e
          temp_dir=$(mktemp -d -p ./)
          echo "TEMP_DIR=$temp_dir" >> "$GITHUB_ENV"
          echo "Generating assets..."
          get_platform_prefix() {
            case "$1" in
              "macos") echo "app-macos" ;;
              "windows") echo "app-windows" ;;
              "ubuntu") echo "app-linux" ;;
              *) echo "::error::Unsupported platform: $1" >&2; exit 1 ;;
            esac
          }
          get_feature() {
            case "$1" in
              "l") echo "localize" ;;
              "k") echo "skip" ;;
              "t") echo "trial" ;;
            esac
          }
          prefix=$(get_platform_prefix "${{ inputs.platform }}")
          RELEASE_LIST="${{ vars.RELEASE_LIST || 'l' }}"
          IFS=',' read -ra releases <<< "$RELEASE_LIST"
          for release in "${releases[@]}"; do
            args="" features=""
            for ((i=0; i<${#release}; i++)); do
              char="${release:$i:1}"
              feature=$(get_feature "$char")
              [ -n "$feature" ] && { args+="$char"; features="${features:+$features-}$feature"; } || echo "::warning::Ignoring unknown argument: $char" >&2
            done
            # fontlang.py 在 fonts/ 目录存在时自动注入字体，无需额外参数；文件名追加 -font 标识
            features="${features:+$features-}font"
            if [ -z "$args" ]; then
              echo "::error::Invalid release spec '$release' in RELEASE_LIST" >&2
              exit 1
            fi
            file="${prefix}-${features}.asar"
            python fontlang.py -"$args" && cp "${{ inputs.source_path }}" "$temp_dir/$file" || exit 1
            python tools/verify_build.py "$temp_dir/$file" --fonts || exit 1
            echo "✓ $file"
          done
          cd "$temp_dir"
          # 生成校验文件：安装器用它做免下载比对与下载完整性校验。
          # macOS 没有 sha256sum，回退到 shasum。
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.asar | sed 's/ \*/  /' > "SHA256SUMS-${{ inputs.platform }}.txt"
          else
            shasum -a 256 *.asar | sed 's/ \*/  /' > "SHA256SUMS-${{ inputs.platform }}.txt"
          fi
          ls -lah .
      - name: Prepare release notes
        if: steps.compare_versions.outputs.should_continue == 'true'
        id: prepare_release_notes
        shell: bash
        run: |
          set -e
          echo "Preparing release notes..."
          [[ -f ./RELEASE_NOTES_FONT.md ]] || { echo "::error::RELEASE_NOTES_FONT.md not found"; exit 1; }
          updated_notes=$(sed "s/{{VERSION}}/v$TERMIUS_VERSION/g" ./RELEASE_NOTES_FONT.md)
          {
            echo "updated_release_notes<<EOF"
            echo "$updated_notes"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "✓ Release notes updated with v$TERMIUS_VERSION"
      - name: Publish release with generated assets
        if: steps.compare_versions.outputs.should_continue == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          tag: v${{ env.TERMIUS_VERSION }}
          body: ${{ steps.prepare_release_notes.outputs.updated_release_notes }}
          draft: ${{ !inputs.publish }}
          prerelease: false
          artifacts: ${{ env.TEMP_DIR }}/*.asar,${{ env.TEMP_DIR }}/SHA256SUMS-*.txt
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cleanup temporary resources
        if: always()
        shell: bash
        run: |
          if [ -d "$TEMP_DIR" ]; then
            echo "Cleaning up temporary directory: $TEMP_DIR"
            rm -rf "$TEMP_DIR"
          fi